[package]
name = "magic-hand"
version = "0.1.0"
description = "Folien per Handgeste wechseln"
authors = ["Léon Brodbeck", "Michael Gasser", "Kaspar Streiff", "Diego Esposito"]
repository = "https://github.com/brodbeckleon/magic-hand"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "magic_hand_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
enigo = "0.6"
tauri-plugin-dialog = "2"
