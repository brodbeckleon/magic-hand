name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check-bundle
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      - run: pnpm e2e
        env:
          E2E_PROD: "1"

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Signed + notarised only when the secrets exist (docs/release.md). Empty variables would make
      # the bundler try to import an empty certificate, so the unsigned build sets none.
      - name: tauri build (signed)
        if: env.HAS_APPLE_CERT == 'true' && runner.os == 'macOS'
        run: pnpm tauri build
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: tauri build
        if: env.HAS_APPLE_CERT != 'true' || runner.os != 'macOS'
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: magic-hand-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

  golden:
    # The fixtures must be what the unmodified Python prototype produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python prototype/tools/gen_golden.py
      - run: git diff --exit-code tests/fixtures

  native-linux:
    # Starts the real app (WebKitGTK) under Xvfb and drives it through tauri-driver: IPC commands,
    # settings.json on disk, the pill window, and real keystrokes arriving (tests/native/smoke.ts).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev xvfb
          # The WebDriver package name differs between Ubuntu releases.
          sudo apt-get install -y webkit2gtk-driver || sudo apt-get install -y webkitgtk-webdriver
      - run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets
      - run: pnpm tauri build --debug --no-bundle
      - run: |
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          DISPLAY=:99 tauri-driver &
          sleep 2
          DISPLAY=:99 pnpm exec tsx tests/native/smoke.ts src-tauri/target/debug/magic-hand
