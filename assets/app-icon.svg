  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#12a594" stroke-opacity="0.35" stroke-width="10"/>
  <!-- swipe trail -->
  <path d="M800 640 H330" stroke="url(#trail)" stroke-width="70" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <path d="M800 640 H330" stroke="url(#trail)" stroke-width="42" stroke-linecap="round"/>
  <path d="M410 560 L300 640 L410 720" fill="none" stroke="#f06a4f" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
