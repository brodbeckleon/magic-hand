<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2330"/>
      <stop offset="1" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="800" y1="0" x2="330" y2="0">
      <stop offset="0" stop-color="#e0452a" stop-opacity="0"/>
      <stop offset="1" stop-color="#f06a4f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
