    <path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12M11 11V4.5a1.5 1.5 0 0 1 3 0V12M14 11.5V6a1.5 1.5 0 0 1 3 0v8c0 4-2.5 7-6.5 7c-3 0-4.3-1.6-6-4.3L3 14.2a1.5 1.5 0 0 1 2.5-1.6L8 15.5"/>
